<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>核心实现②：预览访问链路修复</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: '#0F4C82',
          secondary: '#1F497D',
          accent: '#2A9FD6'
        },
        fontFamily: {
          heading: ['Microsoft YaHei', 'PingFang SC', 'sans-serif'],
          body: ['Noto Sans SC', 'Inter', 'Arial', 'sans-serif']
        }
      }
    }
  }
</script>
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="w-[1280px] h-[720px] overflow-hidden m-0 p-0 relative font-body">
  <div class="absolute inset-0 z-0 bg-[#F7FAFD]"></div>
  <div class="absolute top-0 left-0 w-1.5 h-full bg-primary z-10"></div>
  <div class="absolute top-0 left-0 right-0 h-16 bg-white z-10 flex items-center px-16 border-b border-slate-200">
    <div class="w-1 h-7 bg-accent mr-4"></div>
    <span class="font-heading text-primary text-xl font-semibold">核心实现 ② · 预览访问链路修复</span>
    <span class="ml-3 text-slate-400 text-sm tracking-widest">PREVIEW CHAIN FIX</span>
    <span class="ml-3 px-2 py-0.5 rounded bg-rose-50 text-rose-600 text-xs font-semibold border border-rose-200">★ 工程亮点</span>
    <div class="ml-auto flex items-center text-slate-400 text-sm">
      <span class="font-semibold text-primary">09</span><span class="mx-1">/</span><span>16</span>
    </div>
  </div>

  <div class="relative z-20 pt-20 px-16 flex flex-col h-[640px] gap-3">

    <!-- 上：链路图 -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 flex-1">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-2">
          <div class="w-1 h-5 bg-accent"></div>
          <span class="text-sm font-heading font-semibold text-slate-800">图 4.8 · 文件预览访问链路图</span>
        </div>
        <span class="text-xs text-slate-400">Preview Chain</span>
      </div>
      <div class="h-[310px] flex items-center justify-center bg-slate-50 rounded-xl border border-slate-100 overflow-hidden">
        <img src="../assets/figures/fig_4_8_preview_chain.png"
             alt="文件预览访问链路图"
             class="max-w-full max-h-full object-contain" />
      </div>
    </div>

    <!-- 中：3 个要点卡片 -->
    <div class="grid grid-cols-3 gap-3">
      <div class="bg-white rounded-xl border border-slate-200 p-3 flex items-start gap-3">
        <div class="w-9 h-9 rounded-lg bg-primary/10 flex items-center justify-center flex-shrink-0">
          <i data-lucide="git-merge" class="w-4 h-4 text-primary"></i>
        </div>
        <div class="flex-1 min-w-0">
          <div class="text-sm font-semibold text-slate-800">三类路径统一</div>
          <div class="text-xs text-slate-500 mt-0.5 leading-snug font-mono break-all">/api/files · /api/thum · /api/trans</div>
        </div>
      </div>

      <div class="bg-white rounded-xl border-2 border-accent bg-accent/5 p-3 flex items-start gap-3">
        <div class="w-9 h-9 rounded-lg bg-accent flex items-center justify-center flex-shrink-0">
          <i data-lucide="shield-check" class="w-4 h-4 text-white"></i>
        </div>
        <div class="flex-1 min-w-0">
          <div class="text-sm font-semibold text-slate-800">secret + expire 签名</div>
          <div class="text-xs text-slate-600 mt-0.5 leading-snug">防盗链 + 防过期续命，攻击者无法离线构造</div>
        </div>
      </div>

      <div class="bg-white rounded-xl border border-slate-200 p-3 flex items-start gap-3">
        <div class="w-9 h-9 rounded-lg bg-primary/10 flex items-center justify-center flex-shrink-0">
          <i data-lucide="lock" class="w-4 h-4 text-primary"></i>
        </div>
        <div class="flex-1 min-w-0">
          <div class="text-sm font-semibold text-slate-800">路径越界检查</div>
          <div class="text-xs text-slate-500 mt-0.5 leading-snug">归一化必须落在 /files 内，杜绝 ../</div>
        </div>
      </div>
    </div>

    <!-- 底部修复说明 -->
    <div class="bg-rose-50 border border-rose-200 rounded-xl px-4 py-2.5 flex items-center gap-3">
      <i data-lucide="triangle-alert" class="w-4 h-4 text-rose-600 flex-shrink-0"></i>
      <div class="text-xs text-slate-700">
        <span class="font-semibold text-rose-700">改造前</span> 反向代理叠加签名校验时频繁返回 failed
        <span class="mx-2 text-slate-400">→</span>
        <span class="font-semibold text-emerald-700">改造后</span> 预览链路稳定，分享 / 缩略图 / 转码资源全部共用此校验
      </div>
    </div>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
