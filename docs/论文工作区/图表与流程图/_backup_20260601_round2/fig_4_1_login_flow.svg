<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1250" viewBox="0 0 2600 1250" style="background-color:#ffffff">
  <title>图 4.1  用户登录流程图</title>
  <desc>图 4.1  用户登录流程图；图名仅写入文件元数据，论文排版时请在图片下方另写图题。</desc>
  <defs>
<marker id="arrow" markerWidth="14" markerHeight="11" refX="20" refY="8" viewBox="0 0 22 16" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M 0 0 L 22 8 L 0 16 z" fill="#000000" />
        </marker>
        </defs>
  <rect x="0" y="0" width="2600" height="1250" fill="#ffffff" stroke="none" />
  <rect x="250.0" y="160.0" width="760.0" height="92.0" rx="32.0" ry="32.0" fill="#ffffff" stroke="#000000" stroke-width="4.4" /><text x="630.0" y="206.0" text-anchor="middle" font-family="SimHei, Heiti SC, Songti SC, STSong, Times New Roman, serif" font-size="44" font-weight="400" fill="#000000" dominant-baseline="middle">开始</text><polygon points="298.0,320.0 1010.0,320.0 962.0,412.0 250.0,412.0" fill="#ffffff" stroke="#000000" stroke-width="4.4" /><text x="630.0" y="366.0" text-anchor="middle" font-family="SimHei, Heiti SC, Songti SC, STSong, Times New Roman, serif" font-size="44" font-weight="400" fill="#000000" dominant-baseline="middle">输入用户名和密码</text><rect x="250.0" y="480.0" width="760.0" height="92.0" rx="4" ry="4" fill="#ffffff" stroke="#000000" stroke-width="4.4" /><text x="630.0" y="526.0" text-anchor="middle" font-family="SimHei, Heiti SC, Songti SC, STSong, Times New Roman, serif" font-size="44" font-weight="400" fill="#000000" dominant-baseline="middle">前端调用 /api/user/login</text><rect x="250.0" y="640.0" width="760.0" height="92.0" rx="4" ry="4" fill="#ffffff" stroke="#000000" stroke-width="4.4" /><text x="630.0" y="686.0" text-anchor="middle" font-family="SimHei, Heiti SC, Songti SC, STSong, Times New Roman, serif" font-size="44" font-weight="400" fill="#000000" dominant-baseline="middle">后端使用 BCrypt 校验密码</text><polygon points="630.0,810.0 930.0,900.0 630.0,990.0 330.0,900.0" fill="#ffffff" stroke="#000000" stroke-width="4.4" /><text x="630.0" y="900.0" text-anchor="middle" font-family="SimHei, Heiti SC, Songti SC, STSong, Times New Roman, serif" font-size="44" font-weight="400" fill="#000000" dominant-baseline="middle">密码是否正确</text><rect x="1600.0" y="560.0" width="760.0" height="92.0" rx="4" ry="4" fill="#ffffff" stroke="#000000" stroke-width="4.4" /><text x="1980.0" y="606.0" text-anchor="middle" font-family="SimHei, Heiti SC, Songti SC, STSong, Times New Roman, serif" font-size="44" font-weight="400" fill="#000000" dominant-baseline="middle">生成 JWT 并返回前端</text><rect x="1600.0" y="730.0" width="760.0" height="92.0" rx="4" ry="4" fill="#ffffff" stroke="#000000" stroke-width="4.4" /><text x="1980.0" y="776.0" text-anchor="middle" font-family="SimHei, Heiti SC, Songti SC, STSong, Times New Roman, serif" font-size="44" font-weight="400" fill="#000000" dominant-baseline="middle">前端保存 token 并跳转主页</text><rect x="1600.0" y="900.0" width="760.0" height="92.0" rx="32.0" ry="32.0" fill="#ffffff" stroke="#000000" stroke-width="4.4" /><text x="1980.0" y="946.0" text-anchor="middle" font-family="SimHei, Heiti SC, Songti SC, STSong, Times New Roman, serif" font-size="44" font-weight="400" fill="#000000" dominant-baseline="middle">结束</text><path d="M 630.0 252.0 L 630.0 320.0" stroke="#000000" stroke-width="4.4" stroke-linecap="square" stroke-linejoin="miter" fill="none" marker-end="url(#arrow)" /><path d="M 630.0 412.0 L 630.0 480.0" stroke="#000000" stroke-width="4.4" stroke-linecap="square" stroke-linejoin="miter" fill="none" marker-end="url(#arrow)" /><path d="M 630.0 572.0 L 630.0 640.0" stroke="#000000" stroke-width="4.4" stroke-linecap="square" stroke-linejoin="miter" fill="none" marker-end="url(#arrow)" /><path d="M 630.0 732.0 L 630.0 810.0" stroke="#000000" stroke-width="4.4" stroke-linecap="square" stroke-linejoin="miter" fill="none" marker-end="url(#arrow)" /><path d="M 930.0 900.0 L 1320.0 900.0 L 1320.0 606.0 L 1600.0 606.0" stroke="#000000" stroke-width="4.4" stroke-linecap="square" stroke-linejoin="miter" fill="none" marker-end="url(#arrow)" /><text x="1390.0" y="841.0" text-anchor="middle" font-family="SimHei, Heiti SC, Songti SC, STSong, Times New Roman, serif" font-size="40" font-weight="700" fill="#000000" dominant-baseline="middle">是</text><path d="M 1980.0 652.0 L 1980.0 730.0" stroke="#000000" stroke-width="4.4" stroke-linecap="square" stroke-linejoin="miter" fill="none" marker-end="url(#arrow)" /><path d="M 1980.0 822.0 L 1980.0 900.0" stroke="#000000" stroke-width="4.4" stroke-linecap="square" stroke-linejoin="miter" fill="none" marker-end="url(#arrow)" /><path d="M 330.0 900.0 L 125.0 900.0 L 125.0 366.0 L 250.0 366.0" stroke="#000000" stroke-width="4.4" stroke-linecap="square" stroke-linejoin="miter" fill="none" marker-end="url(#arrow)" /><text x="170.0" y="609.0" text-anchor="middle" font-family="SimHei, Heiti SC, Songti SC, STSong, Times New Roman, serif" font-size="40" font-weight="700" fill="#000000" dominant-baseline="middle">否</text>
</svg>
