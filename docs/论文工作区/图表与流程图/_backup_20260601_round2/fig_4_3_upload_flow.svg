ke="#000000" stroke-width="4.4" stroke-linecap="square" stroke-linejoin="miter" fill="none" marker-end="url(#arrow)" /><path d="M 2030.0 950.0 L 2030.0 1010.0" stroke="#000000" stroke-width="4.4" stroke-linecap="square" stroke-linejoin="miter" fill="none" marker-end="url(#arrow)" /><text x="2100.0" y="956.0" text-anchor="middle" font-family="SimHei, Heiti SC, Songti SC, STSong, Times New Roman, serif" font-size="40" font-weight="700" fill="#000000" dominant-baseline="middle">是</text><path d="M 2030.0 1102.0 L 2030.0 1160.0" stroke="#000000" stroke-width="4.4" stroke-linecap="square" stroke-linejoin="miter" fill="none" marker-end="url(#arrow)" /><path d="M 2030.0 1252.0 L 2030.0 1310.0" stroke="#000000" stroke-width="4.4" stroke-linecap="square" stroke-linejoin="miter" fill="none" marker-end="url(#arrow)" /><path d="M 2330.0 860.0 L 2650.0 860.0 L 2650.0 1206.0 L 2460.0 1206.0" stroke="#000000" stroke-width="4.4" stroke-linecap="square" stroke-linejoin="miter" fill="none" marker-end="url(#arrow)" /><text x="2700.0" y="1009.0" text-anchor="middle" font-family="SimHei, Heiti SC, Songti SC, STSong, Times New Roman, serif" font-size="40" font-weight="700" fill="#000000" dominant-baseline="middle">否</text>
