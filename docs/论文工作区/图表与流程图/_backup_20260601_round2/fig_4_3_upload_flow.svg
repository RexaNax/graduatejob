<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2850" height="1650" viewBox="0 0 2850 1650" style="background-color:#ffffff">
  <title>图 4.3  文件上传流程图</title>
  <desc>图 4.3  文件上传流程图；图名仅写入文件元数据，论文排版时请在图片下方另写图题。</desc>
  <defs>
<marker id="arrow" markerWidth="14" markerHeight="11" refX="20" refY="8" viewBox="0 0 22 16" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M 0 0 L 22 8 L 0 16 z" fill="#000000" />
        </marker>
        </defs>
  <rect x="0" y="0" width="2850" height="1650" fill="#ffffff" stroke="none" />
  <rect x="220.0" y="150.0" width="860.0" height="92.0" rx="32.0" ry="32.0" fill="#ffffff" stroke="#000000" stroke-width="4.4" /><text x="650.0" y="196.0" text-anchor="middle" font-family="SimHei, Heiti SC, Songti SC, STSong, Times New Roman, serif" font-size="44" font-weight="400" fill="#000000" dominant-baseline="middle">开始</text><polygon points="268.0,300.0 1080.0,300.0 1032.0,392.0 220.0,392.0" fill="#ffffff" stroke="#000000" stroke-width="4.4" /><text x="650.0" y="346.0" text-anchor="middle" font-family="SimHei, Heiti SC, Songti SC, STSong, Times New Roman, serif" font-size="44" font-weight="400" fill="#000000" dominant-baseline="middle">用户选择文件</text><rect x="220.0" y="450.0" width="860.0" height="118.0" rx="4" ry="4" fill="#ffffff" stroke="#000000" stroke-width="4.4" /><text x="650.0" y="488.8" text-anchor="middle" font-family="SimHei, Heiti SC, Songti SC, STSong, Times New Roman, serif" font-size="36" font-weight="400" fill="#000000" dominant-baseline="middle">前端发起 /api/file/upload 请求</text><text x="650.0" y="529.2" text-anchor="middle" font-family="SimHei, Heiti SC, Songti SC, STSong, Times New Roman, serif" font-size="36" font-weight="400" fill="#000000" dominant-baseline="middle">携带 JWT</text><polygon points="650.0,640.0 950.0,730.0 650.0,820.0 350.0,730.0" fill="#ffffff" stroke="#000000" stroke-width="4.4" /><text x="650.0" y="730.0" text-anchor="middle" font-family="SimHei, Heiti SC, Songti SC, STSong, Times New Roman, serif" font-size="44" font-weight="400" fill="#000000" dominant-baseline="middle">JWT 是否有效</text><rect x="1600.0" y="245.0" width="860.0" height="118.0" rx="4" ry="4" fill="#ffffff" stroke="#000000" stroke-width="4.4" /><text x="2030.0" y="283.8" text-anchor="middle" font-family="SimHei, Heiti SC, Songti SC, STSong, Times New Roman, serif" font-size="36" font-weight="400" fill="#000000" dominant-baseline="middle">CurrentUserService</text><text x="2030.0" y="324.2" text-anchor="middle" font-family="SimHei, Heiti SC, Songti SC, STSong, Times New Roman, serif" font-size="36" font-weight="400" fill="#000000" dominant-baseline="middle">解析当前用户 ID</text><rect x="1600.0" y="430.0" width="860.0" height="92.0" rx="4" ry="4" fill="#ffffff" stroke="#000000" stroke-width="4.4" /><text x="2030.0" y="476.0" text-anchor="middle" font-family="SimHei, Heiti SC, Songti SC, STSong, Times New Roman, serif" font-size="44" font-weight="400" fill="#000000" dominant-baseline="middle">写入本地持久化目录</text><rect x="1600.0" y="580.0" width="860.0" height="118.0" rx="4" ry="4" fill="#ffffff" stroke="#000000" stroke-width="4.4" /><text x="2030.0" y="618.8" text-anchor="middle" font-family="SimHei, Heiti SC, Songti SC, STSong, Times New Roman, serif" font-size="36" font-weight="400" fill="#000000" dominant-baseline="middle">插入 lfs_file 记录</text><text x="2030.0" y="659.2" text-anchor="middle" font-family="SimHei, Heiti SC, Songti SC, STSong, Times New Roman, serif" font-size="36" font-weight="400" fill="#000000" dominant-baseline="middle">含 user_id</text><polygon points="2030.0,770.0 2330.0,860.0 2030.0,950.0 1730.0,860.0" fill="#ffffff" stroke="#000000" stroke-width="4.4" /><text x="2030.0" y="860.0" text-anchor="middle" font-family="SimHei, Heiti SC, Songti SC, STSong, Times New Roman, serif" font-size="44" font-weight="400" fill="#000000" dominant-baseline="middle">是否生成缩略图</text><rect x="1600.0" y="1010.0" width="860.0" height="92.0" rx="4" ry="4" fill="#ffffff" stroke="#000000" stroke-width="4.4" /><text x="2030.0" y="1056.0" text-anchor="middle" font-family="SimHei, Heiti SC, Songti SC, STSong, Times New Roman, serif" font-size="44" font-weight="400" fill="#000000" dominant-baseline="middle">写入 lfs_file_thum 记录</text><rect x="1600.0" y="1160.0" width="860.0" height="92.0" rx="4" ry="4" fill="#ffffff" stroke="#000000" stroke-width="4.4" /><text x="2030.0" y="1206.0" text-anchor="middle" font-family="SimHei, Heiti SC, Songti SC, STSong, Times New Roman, serif" font-size="44" font-weight="400" fill="#000000" dominant-baseline="middle"