<svg xmlns="http://www.w3.org/2000/svg" width="3050" height="1500" viewBox="0 0 3050 1500" style="background-color:#ffffff">
  <title>图 4.7  文件预览访问链路图</title>
  <desc>图 4.7  文件预览访问链路图；图名仅写入文件元数据，论文排版时请在图片下方另写图题。</desc>
  <rect x="0" y="0" width="3050" height="1500" fill="#ffffff" stroke="none" />
  <rect x="220.0" y="145.0" width="820.0" height="92.0" rx="32.0" ry="32.0" fill="#ffffff" stroke="#000000" stroke-width="4.4" /><text x="630.0" y="191.0" text-anchor="middle" font-family="SimHei, Heiti SC, Songti SC, STSong, Times New Roman, serif" font-size="44" font-weight="400" fill="#000000" dominant-baseline="middle">开始</text><polygon points="268.0,295.0 1040.0,295.0 992.0,425.0 220.0,425.0" fill="#ffffff" stroke="#000000" stroke-width="4.4" /><text x="630.0" y="339.3" text-anchor="middle" font-family="SimHei, Heiti SC, Songti SC, STSong, Times New Roman, serif" font-size="37" font-weight="400" fill="#000000" dominant-baseline="middle">前端发起预览请求</text><text x="630.0" y="380.7" text-anchor="middle" font-family="SimHei, Heiti SC, Songti SC, STSong, Times New Roman, serif" font-size="37" font-weight="400" fill="#000000" dominant-baseline="middle">/api/files/{path}?secret=...&amp;expire=...</text><rect x="220.0" y="500.0" width="820.0" height="92.0" rx="4" ry="4" fill="#ffffff" stroke="#000000" stroke-width="4.4" /><text x="630.0" y="546.0" text-anchor="middle" font-family="SimHei, Heiti SC, Songti SC, STSong, Times New Roman, serif" font-size="44" font-weight="400" fill="#000000" dominant-baseline="middle">Nginx 反向代理转发</text><rect x="220.0" y="650.0" width="820.0" height="118.0" rx="4" ry="4" fill="#ffffff" stroke="#000000" stroke-width="4.4" /><text x="630.0" y="688.8" text-anchor="middle" font-family="SimHei, Heiti SC, Songti SC, STSong, Times New Roman, serif" font-size="36" font-weight="400" fill="#000000" dominant-baseline="middle">FilePreviewController</text><text x="630.0" y="729.2" text-anchor="middle" font-family="SimHei, Heiti SC, Songti SC, STSong, Times New Roman, serif" font-size="36" font-weight="400" fill="#000000" dominant-baseline="middle">归一化请求路径</text><polygon points="630.0,840.0 930.0,930.0 630.0,1020.0 330.0,930.0" fill="#ffffff" stroke="#000000" stroke-width="4.4" /><text x="630.0" y="930.0" text-anchor="middle" font-family="SimHei, Heiti SC, Songti SC, STSong, Times New Roman, serif" font-size="44" font-weight="400" fill="#000000" dominant-baseline="middle">expire 是否过期</text><polygon points="1910.0,285.0 2210.0,375.0 1910.0,465.0 1610.0,375.0" fill="#ffffff" stroke="#000000" stroke-width="4.4" /><text x="1910.0" y="375.0" text-anchor="middle" font-family="SimHei, Heiti SC, Songti SC, STSong, Times New Roman, serif" font-size="44" font-weight="400" fill="#000000" dominant-baseline="middle">签名是否一致</text><rect x="1500.0" y="545.0" width="820.0" height="92.0" rx="4" ry="4" fill="#ffffff" stroke="#000000" stroke-width="4.4" /><text x="1910.0" y="591.0" text-anchor="middle" font-family="SimHei, Heiti SC, Songti SC, STSong, Times New Roman, serif" font-size="44" font-weight="400" fill="#000000" dominant-baseline="middle">读取本地持久化目录中的文件</text><rect x="1500.0" y="705.0" width="820.0" height="92.0" rx="4" ry="4" fill="#ffffff" stroke="#000000" stroke-width="4.4" /><text x="1910.0" y="751.0" text-anchor="middle" font-family="SimHei, Heiti SC, Songti SC, STSong, Times New Roman, serif" font-size="44" font-weight="400" fill="#000000" dominant-baseline="middle">返回文件流给前端</text><rect x="1500.0" y="900.0" width="820.0" height="92.0" rx="32.0" ry="32.0" fill="#ffffff" stroke="#000000" stroke-width="4.4" /><text x="1910.0" y="946.0" text-anchor="middle" font-family="SimHei, Heiti SC, Songti SC, STSong, Times New Roman, serif" font-size="44" font-weight="400" fill="#000000" dominant-baseline="middle">结束</text><rect x="2520.0" y="650.0" width="360.0" height="92.0" rx="4" ry="4" fill="#ffffff" stroke="#000000" stroke-width="4.4" /><text x="2700.0" y="696.0" text-anchor="middle" font-family="SimHei, Heiti SC, Songti SC, STSong, Times New Roman, serif" font-size="44" font-weight="400" fill="#000000" dominant-baseline="middle">返回 403</text><path d="M 630.0 237.0 L 630.0 295.0" stroke="#000000" stroke-width="4.4" stroke-linecap="square" stroke-linejoin="miter" fill="none" /><path d="M 630.0 425.0 L 630.0 500.0" stroke="#000000" 