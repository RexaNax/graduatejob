# 讲解抓手：
# 1. 这个文件是整个系统的“总编排表”，定义了 4 个容器怎么一起启动。
# 2. 演示时先看 services，再看 ports / environment / volumes。
# 3. 重点说明：nginx 是入口，backend 处理业务，mysql 存数据，redis 存缓存。

services:
  nginx:
    image: nginx:alpine
    container_name: lfs-nginx
    ports:
      - "80:80" # 用户最终访问的是 http://localhost
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro # 挂载前端打包后的静态文件
    depends_on:
      - backend
    networks:
      - lfs-network
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: lfs-backend
    environment:
      # 这里用 mysql / redis 作为主机名，说明后端是通过 Docker 内部网络访问其他容器。
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/lfs?characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=lfs123456
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - CONFIG_FILE_SERVER_LOCAL_FILE_DIR=/app/uploadFile
      - CONFIG_FILE_SERVER_LOCAL_PREVIEW_URL=http://localhost/api
    volumes:
      - upload-data:/app/uploadFile # 上传文件单独持久化，避免容器重建后丢失
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - lfs-network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: lfs-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=lfs123456
      - MYSQL_DATABASE=lfs
      - MYSQL_CHARSET=utf8mb4
      - MYSQL_COLLATION=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ../backend/sql:/docker-entrypoint-initdb.d:ro # 首次启动时自动执行初始化 SQL
    ports:
      - "3308:3306" # 宿主机用 3308，容器内仍然是 3306
    networks:
      - lfs-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-plfs123456"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lfs-redis
    volumes:
      - redis-data:/data
    ports:
      - "6380:6379"
    networks:
      - lfs-network
    restart: unless-stopped

networks:
  lfs-network:
    driver: bridge

# 数据卷的意义：数据库、缓存和上传文件都落到宿主机目录，
# 这样即使容器删除重建，业务数据也不会一起消失。
volumes:
  mysql-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: E:\lfs-data\mysql
  redis-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: E:\lfs-data\redis
  upload-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: E:\lfs-data\upload
